name: Build deployment apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            requirements: requirements-unix.txt
            script: build-linux.sh
            artifact_path: artifacts/skin-loader/linux-x86_64
          - runner: macos-15
            platform: macos-arm64
            requirements: requirements-unix.txt
            script: build-macos.sh
            artifact_path: artifacts/skin-loader/macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
            requirements: requirements-unix.txt
            script: build-macos.sh
            artifact_path: artifacts/skin-loader/macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r apps/windows-loader/${{ matrix.requirements }}
      - name: Build and test
        env:
          PYTHON: python
        run: bash apps/windows-loader/${{ matrix.script }}
      - name: Upload candidate
        uses: actions/upload-artifact@v6
        with:
          name: cppro-skin-loader-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
