name: Validate skin library

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check generated catalog
        run: python tools/build-skin-catalog.py --check
      - name: Verify catalog PAKs
        run: python apps/windows-loader/verify_catalog.py
      - name: Install loader dependencies
        run: python -m pip install -r apps/windows-loader/requirements-build.txt
      - name: Test loader core
        env:
          PYTHONPATH: apps/windows-loader
        run: python -m unittest discover -s apps/windows-loader/tests -v
      - name: Test reference runtime
        run: python -m unittest discover -s reference/runtime -v
